[project]
name = "decodo-adk"
version = "0.0.0"
description = "Decodo Web Data API tools for Google ADK agents."
readme = "README.md"
license = "MIT"
authors = [{ name = "Decodo", email = "support@decodo.com" }]
keywords = ["decodo", "google-adk", "gemini", "web-scraping", "agents", "tools"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    # 3.1.0 is the first release with flows and surfaces, which every tool is built from.
    "decodo-sdk>=3.1.0",
    # 2.14 passes a raw JSON schema through FunctionDeclaration.parameters_json_schema.
    "google-adk>=2.14,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
example = ["gspread>=6.2"]
dev = ["decodo-adk[example]", "pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Homepage = "https://decodo.com"
Repository = "https://github.com/Decodo/google-adk"
Documentation = "https://help.decodo.com/docs/introduction"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["decodo_adk"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
packages = ["decodo_adk", "research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "main"
