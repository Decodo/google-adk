[project]
name = "gemini-research"
version = "0.1.0"
description = "A Google ADK research agent that uses Decodo to search and read the web, Gemini to analyse it and Google Sheets to log it"
readme = "README.md"
license = "MIT"
authors = [{ name = "Decodo" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    # 2.6.0 is the first release with flows and surfaces, which every tool is built from.
    "decodo-sdk>=2.6.0",
    # 2.14 passes a raw JSON schema through FunctionDeclaration.parameters_json_schema.
    "google-adk>=2.14,<3",
    "gspread>=6.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["decodo_adk", "research_agent"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
packages = ["decodo_adk", "research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
